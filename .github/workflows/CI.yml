name: Build, Test, and Deploy API

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup .NET environment
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Dependency Restore
      run: dotnet restore
      
    - name: Project Build
      run: dotnet build --configuration Release

    - name: Project UnitTest
      working-directory: SmartInventoryManagementSystem.UnitTests
      run: dotnet test

    - name: Publish API Project
      run: dotnet publish SmartInventoryManagementSystem.API/SmartInventoryManagementSystem.API.csproj -c Release -o ./publish
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'IMS-HSP'
        publish-profile: ${{ secrets.IMS_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
